le{margin-bottom:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.timeline{margin:20px 0 8px}.phases{display:grid;grid-template-columns:10fr 11fr;gap:3px;font-size:11px;margin-bottom:16px}.phases span{padding:7px 10px;background:#e4ede6;border-radius:4px}.phases span+span{background:#f4e9d7}.samples{position:relative;height:92px;margin:0 24px;padding-top:5px}.samples:before{content:'';height:1px;background:var(--line);position:absolute;left:15px;right:15px;top:16px}.sample{width:70px;white-space:nowrap;position:absolute;transform:translateX(-50%);z-index:1;display:grid;justify-items:center;gap:5px;font-size:11px}.dot{width:23px;height:23px;border:2px solid var(--accent);border-radius:50%;background:var(--accent);color:white;display:grid;place-items:center;font-size:10px}.sample.future .dot{background:#fff;border-style:dashed;color:var(--muted)}.sample.cutoff .dot{box-shadow:0 0 0 4px #cce2bc}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}.bar{display:flex;height:27px;border-radius:4px;overflow:hidden;background:var(--soft)}.bar span{display:flex;align-items:center;justify-content:center;color:white;font-size:10px;min-width:0}.barline{display:grid;grid-template-columns:90px 1fr 70px;gap:12px;align-items:center;margin:14px 0;font-size:12px}.barline .muted{text-align:right}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label.field{display:grid;gap:6px;font-size:12px;font-weight:600}select{padding:9px;background:white;border:1px solid var(--line);border-radius:6px;color:var(--ink);width:100%}.target{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:12px}.target:has(:checked){background:var(--soft);border-color:var(--accent)}input{accent-color:var(--accent)}.method{display:block;text-align:left;width:100%;margin-top:8px;padding:12px}.method small{display:block;margin:3px 0 0 23px}.method strong{font-weight:600}.divider{height:1px;background:var(--line);margin:18px 0}.empty{padding:40px 24px;text-align:center;border:1px dashed var(--line);border-radius:8px}.empty h2{margin:10px 0}.score{font-size:36px;letter-spacing:-1.5px;line-height:1.1}.metric{background:var(--paper);padding:16px;border-radius:7px}.metric small{display:block;margin-bottom:8px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:right;padding:10px 8px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{font-weight:500;color:var(--muted);font-size:11px}.table-wrap{overflow:auto}.history{display:grid;gap:7px}.history button{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px}.history small{display:block}.footer-note{font-size:11px;color:var(--muted);margin:20px 0}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:8px;background:#173332;color:#fff;border:1px solid #37514d;border-radius:40px;box-shadow:0 8px 35px #122c3333;z-index:20;white-space:nowrap}.switcher button{border:0;background:transparent;color:#fff;border-radius:30px;padding:8px 13px}.switcher button.active{background:#d9e9a9;color:#1c3930}.switcher small{color:#c2d2cc;padding:0 8px}.state-toggle{position:fixed;right:16px;bottom:24px;z-index:21;font-size:11px}.state-panel{position:fixed;right:16px;bottom:76px;width:min(460px,calc(100vw - 32px));max-height:65vh;overflow:auto;background:#102b2b;color:#d5f1da;border-radius:10px;padding:20px;z-index:30;box-shadow:0 8px 30px #0003}.state-panel pre{white-space:pre-wrap;font-size:10px}.study{max-width:1220px;margin:38px auto;padding:0 30px 110px}.study-layout{display:grid;grid-template-columns:210px 1fr;gap:40px;margin-top:34px}.step{display:block;border:0;background:transparent;width:100%;text-align:left;margin:5px 0;padding:12px}.step.active{border-left:3px solid var(--accent);border-radius:0;background:var(--soft)}.step small{display:block;margin-left:24px}.study-bottom{display:flex;justify-content:space-between;margin-top:22px}.workbench{padding:25px 26px 110px}.work-grid{display:grid;grid-template-columns:280px minmax(0,1fr) 260px;gap:18px;margin-top:24px}.work-grid .card{padding:18px}.work-grid .formgrid{grid-template-columns:1fr}.work-grid h1{font-size:25px}.rail-label{padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}.notebook{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100vh - 76px)}.notebook aside{background:#203a3b;color:#edf1e8;padding:28px 22px}.notebook aside .badge{color:var(--ink)}.notebook aside small{color:#b5c9c3}.notebook aside button{background:transparent;color:inherit;border-color:#49615c}.notebook aside button.active{background:#37534e}.notebook article{max-width:950px;width:100%;padding:38px 48px 110px;margin:auto}.notebook h1{font-family:Georgia,serif;font-weight:normal;font-size:36px}.entry{display:grid;grid-template-columns:38px 1fr;gap:14px;margin-top:27px}.entry-no{font:14px monospace;color:#8a9b94;padding-top:16px}.entry-body{border-top:1px solid var(--line);padding-top:16px;min-width:0}.entry h2{font-family:Georgia,serif;font-size:22px;font-weight:normal;margin-bottom:16px}.notebook .card{border:0;padding:0;background:transparent}.notebook .metric{background:#e9ede3}.notebook .formgrid{grid-template-columns:1fr 1fr}.toast{position:fixed;right:20px;top:85px;background:#173332;color:white;border-radius:8px;padding:14px;z-index:40;max-width:350px;font-size:12px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #a8b658;outline-offset:3px}@media(max-width:1100px){.work-grid{grid-template-columns:250px 1fr}.work-grid>aside:last-child{grid-column:1/-1}.state-toggle{bottom:85px}.notebook article{padding:30px 25px 130px}}@media(max-width:760px){.top{padding:16px}.top .muted{display:none}.study{padding:0 16px 150px}.study-layout,.work-grid,.notebook,.two{grid-template-columns:1fr}.study-layout{gap:16px}.study-layout nav{display:flex;flex-wrap:wrap}.step{width:auto}.study-layout nav .quiet,.study-layout nav .footer-note{display:none}.notebook aside{padding:18px}.notebook article{padding:25px 16px 150px}.formgrid{grid-template-columns:1fr!important}.switcher{max-width:calc(100vw - 16px);gap:0;bottom:12px}.switcher button{padding:8px}.switcher small{display:none}.workbench{padding:20px 12px 150px}h1{font-size:27px}.card{padding:18px}.barline{grid-template-columns:65px 1fr 48px;gap:6px}.entry{grid-template-columns:24px 1fr}}

<body><div id="app"></div><div id="overlays"></div>
<script>
// UI-only fixture. These calculations are disposable; production science belongs to Python.
const times=[0,3,7,14,21], names=['Lineage A','Lineage B','Lineage C','Lineage D','Unknown ancestry'];
const colors=['#357c70','#90ad66','#c39355','#8e78ae','#9aa8ac'];
const counts={0:[60,25,10,0,5],3:[45,35,15,0,5],7:[25,60,0,0,15],14:[15,55,10,10,10],21:[10,45,15,20,10]};
const variantNames={A:'Guided study',B:'Research workbench',C:'Run notebook'};
const state={variant:['A','B','C'].includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'B',step:0,cutoff:7,targets:[14,21],method:'last',scope:'whole',scenario:'success',runs:[],selected:null,target:14,showCounts:false,showState:false};
let nextRun=1;
const current=()=>state.runs.find(r=>r.id===state.selected);
const methodName=m=>m==='last'?'Last observed composition':'Damped trend extrapolation';
const pct=x=>(x*100).toFixed(1)+'%';
const proportions=t=>counts[t].map(n=>n/100);
const legend=(visible=names.map((_,i)=>i))=>`<div class="legend">${names.map((n,i)=>visible.includes(i)?`<span><i class="swatch" style="background:${colors[i]}"></i>${n}</span>`:'').join('')}</div>`;
function bar(values){return `<div class="bar">${values.map((v,i)=>`<span title="${names[i]}: ${pct(v)}" style="width:${v*100}%;background:${colors[i]}">${v>=.12?Math.round(v*100)+'%':''}</span>`).join('')}</div>`;}
function timeline(cutoff=state.cutoff){return `<div class="timeline"><div class="phases"><span>Treatment exposure · day 0–10</span><span>Withdrawal at day 10 → recovery</span></div><div class="samples">${times.map(t=>`<div style="left:${t/21*100}%" class="sample ${t>cutoff?'future':''} ${t===cutoff?'cutoff':''}"><span class="dot">${t<=cutoff?'•':'○'}</span><b>Day ${t}</b><small>${t===cutoff?'Cutoff':t<cutoff?'Input':'Held out'}</small></div>`).join('')}</div><small>Fictional agent X · 1 µM · Whole-culture sampling · Time in days</small></div>`;}
function observations(){const visible=names.map((_,i)=>i).filter(i=>i===4||times.filter(t=>t<=state.cutoff).some(t=>counts[t][i]>0));return `<div class="row spread section-title"><h2>Observed composition</h2><button data-action="counts">${state.showCounts?'Show proportions':'Show raw counts'}</button></div><p class="muted">Input observations through day ${state.cutoff}. Later measurements are held out.</p>${state.showCounts?`<div class="table-wrap"><table><thead><tr><th>Sample</th>${visible.map(i=>`<th>${names[i]}</th>`).join('')}<th>Total</th></tr></thead><tbody>${times.filter(t=>t<=state.cutoff).map(t=>`<tr><td>Day ${t}</td>${visible.map(i=>`<td>${counts[t][i]}</td>`).join('')}<td>100</td></tr>`).join('')}</tbody></table></div>`:times.filter(t=>t<=state.cutoff).map(t=>`<div class="barline"><span>Day ${t}</span>${bar(proportions(t))}<span class="muted">n = 100</span></div>`).join('')}${legend(visible)}<p class="footer-note">Fractions of sampled cells, not absolute abundance. A zero count means non-detection, not extinction. Unknown ancestry remains in the denominator.</p>`;}
function eligible(){return state.scope==='whole'&&state.targets.length>0&&!(state.method==='trend'&&state.cutoff===0);}
function config(){return `<div class="stack"><div class="formgrid"><label class="field">Culture<select id="culture"><option>Culture 01 · synthetic</option></select></label><label class="field">Sampling scope<select id="scope"><option value="whole" ${state.scope==='whole'?'selected':''}>Whole culture</option><option value="fraction" ${state.scope==='fraction'?'selected':''}>Sorted fraction · incompatible</option></select></label><label class="field">Forecasting cutoff<select id="cutoff">${times.slice(0,-1).map(t=>`<option value="${t}" ${t===state.cutoff?'selected':''}>Day ${t} · ${times.filter(x=>x<=t).length} input sample(s)</option>`).join('')}</select></label><div><span class="eyebrow">Measured target times</span><div class="row" style="margin-top:7px">${times.filter(t=>t>state.cutoff).map(t=>`<label class="target"><input type="checkbox" data-target="${t}" ${state.targets.includes(t)?'checked':''}>Day ${t}</label>`).join('')}</div></div></div><div><h3>Reference method</h3>${['last','trend'].map(m=>`<button class="method ${state.method===m?'active':''}" data-method="${m}" ${m==='trend'&&state.cutoff===0?'disabled':''}><strong>${state.method===m?'◉':'○'} ${methodName(m)}</strong><small>${m==='last'?'Carry the latest observed proportions forward.':state.cutoff===0?'Unavailable: needs two distinct input times.':'Extend the last two observations with fixed damping; α = 0.5.'}</small></button>`).join('')}</div>${state.method==='trend'&&state.cutoff===0?'<div class="notice">Selected trend method is unavailable. Choose another method or a later cutoff; no automatic fallback.</div>':''}${state.scope!=='whole'?'<div class="notice">No comparable target samples for this scope. Whole-culture observations cannot be compared with a sorted fraction.</div>':''}${state.cutoff<10&&state.targets.some(t=>t>10)?'<div class="notice">Crosses treatment withdrawal. These baselines do not model its biological effect.</div>':''}${!state.targets.length?'<div class="notice">Select at least one measured target after the cutoff.</div>':''}<small>Snapshot: demo-ux-v1 · Fixed synthetic fixture · Method settings are not tuned to held-out observations.</small><button class="primary" data-action="run" ${eligible()?'':'disabled'}>Create forecast run →</button></div>`;}
function runHistory(){return state.runs.length?`<div class="history">${state.runs.slice().reverse().map(r=>`<button data-run="${r.id}" class="${state.selected===r.id?'active':''}"><span><b>${r.id}</b><small>Day ${r.cutoff} → ${r.targets.join(', ')} · ${r.method==='last'?'Last observed':'Trend'}</small></span><span class="badge">${r.status}</span></button>`).join('')}</div>`:'<p class="muted">No runs yet. Your first forecast will appear here.</p>';}
function predict(cutoff,method,target){const input=times.filter(t=>t<=cutoff), cats=names.map((_,i)=>i).filter(i=>i===4||input.some(t=>counts[t][i]>0));if(method==='last')return proportions(cutoff);const t0=input.at(-2), t1=input.at(-1);const clr=t=>{const logs=cats.map(i=>Math.log((counts[t][i]+.5)/(100+.5*cats.length)));const avg=logs.reduce((a,b)=>a+b,0)/logs.length;return logs.map(v=>v-avg)};const a=clr(t0),b=clr(t1),d=1-Math.exp(-(target-t1)/(t1-t0)),z=b.map((v,i)=>v+d*(v-a[i])),ex=z.map(v=>Math.exp(v-Math.max(...z))),total=ex.reduce((a,b)=>a+b,0);return names.map((_,i)=>cats.includes(i)?ex[cats.indexOf(i)]/total:0);}
function results(){const r=current();if(!r)return `<div class="empty"><span class="eyebrow">Forecast evidence</span><h2>What changes after the cutoff?</h2><p class="muted">Create a run to compare a baseline forecast with later observations.</p></div>`;if(r.status!=='succeeded')return `<div class="card stack"><div class="row spread"><h2>${r.id}</h2><span class="badge">${r.status}</span></div><p>${r.status==='queued'?'Waiting for the simulated worker.':r.status==='running'?'Computing the fictional forecast…':r.status==='failed'?'Simulated worker interruption. This attempt has no result.':'Run cancelled. This attempt has no result.'}</p><small>Prototype only: execution is simulated in this tab. In the planned application, browser closure will not cancel a run.</small>${['queued','running'].includes(r.status)?'<button data-action="cancel">Cancel run</button>':'<button data-action="retry">Retry as a new run →</button>'}</div>`;
const target=r.targets.includes(state.target)?state.target:r.targets[0], prediction=r.predictions[target], observed=proportions(target), tv=prediction.reduce((sum,p,i)=>sum+Math.abs(p-observed[i]),0)/2,seen=names.map((_,i)=>times.filter(t=>t<=r.cutoff).some(t=>counts[t][i]>0)||i===4),unseen=observed.reduce((sum,v,i)=>sum+(!seen[i]?v:0),0);
return `<div class="stack"><div class="row spread"><div><span class="eyebrow">Saved in this tab · ${r.id}</span><h2>Forecast vs. held-out observation</h2></div><button data-action="export">Export demo JSON ↗</button></div><small>${methodName(r.method)} · Cutoff day ${r.cutoff} · demo-ux-v1<br>This result retains its original configuration when the draft changes.</small><div class="row">${r.targets.map(t=>`<button data-result-target="${t}" class="${t===target?'active':''}">Day ${t}</button>`).join('')}</div><div class="two"><div class="metric"><small>Total variation distance · day ${target}</small><div class="score">${tv.toFixed(3)}</div><small style="margin:8px 0 0">0 = identical · 1 = disjoint</small></div><div class="metric"><small>Previously unseen lineage share</small><div class="score">${pct(unseen)}</div><small style="margin:8px 0 0">Identified only after this cutoff</small></div></div><div><div class="barline"><b>Forecast</b>${bar(prediction)}<span class="muted">baseline</span></div><div class="barline"><b>Held out</b>${bar(observed)}<span class="muted">n = 100</span></div>${legend()}</div><div class="table-wrap"><table><thead><tr><th>Category</th><th>Forecast</th><th>Observed</th><th>Δ (pp)¹</th><th>Count</th></tr></thead><tbody>${names.map((n,i)=>`<tr><td><i class="swatch" style="background:${colors[i]}"></i>${n}${!seen[i]?'<br><small>Previously unseen</small>':''}</td><td>${pct(prediction[i])}</td><td>${pct(observed[i])}</td><td>${((prediction[i]-observed[i])*100).toFixed(1)}</td><td>${counts[target][i]} / 100</td></tr>`).join('')}</tbody></table></div><small>¹ Forecast minus observed, in percentage points. All categories contribute to the score. Target-only lineages have zero predicted proportion; unknown ancestry is a separate category.</small><div class="quiet">Synthetic comparison for UX exploration. No confidence intervals or biological validity claims.</div></div>`;}
function header(){return `<header class="top"><div class="brand"><span class="mark">∿</span> Tumor Dynamics Lab</div><div class="row"><span class="muted">Local research workspace</span><span class="badge synthetic">SYNTHETIC DEMO</span><span class="badge">APPROVED: B + A GUIDANCE</span><span class="badge">THROWAWAY UX</span></div></header>`;}
function VariantA(){const steps=['Inspect experiment','Define forecast','Review evidence'];return `<main class="study"><div class="row spread"><div class="eyebrow">A / First-run guidance</div><button data-variant="B">Return to workbench →</button></div><h1 style="margin-top:10px">From observations to a forecast.</h1><p class="lead">A focused path through one experiment, with the forecast boundary made explicit at each step.</p><div class="study-layout"><nav>${steps.map((s,i)=>`<button class="step ${state.step===i?'active':''}" data-step="${i}">${i+1}. ${s}<small>${['Understand the input','Choose what is knowable','Compare and revisit'][i]}</small></button>`).join('')}<div class="divider"></div><div class="quiet">Fictional recovery study<br><b>Culture 01</b><br>5 samples · days 0–21</div><p class="footer-note">Snapshot demo-ux-v1<br>Prepared data import is a CLI workflow.</p></nav><section class="stack">${state.step===0?`<div class="card"><div class="row spread"><h2>Fictional recovery study</h2><span class="badge">1 culture</span></div>${timeline()}</div><div class="card">${observations()}</div><div class="study-bottom"><small>1 / 3 · Inspect</small><button class="primary" data-step="1">Define a forecast →</button></div>`:state.step===1?`<div class="card"><h2>Draw the boundary of your forecast</h2><p class="lead">Only samples at or before the cutoff inform the predictor.</p>${timeline()}<div class="divider"></div>${config()}</div><button data-step="0">← Back to observations</button>`:`<div class="card">${results()}</div><div class="card"><h2 class="section-title">Run history</h2>${runHistory()}</div><button data-step="1">← Configure another run</button>`}</section></div></main>`;}
function VariantB(){return `<main class="workbench"><div class="row spread"><div><div class="eyebrow">B / Research workbench</div><h1 style="margin-top:7px">Fictional recovery study</h1></div><div class="row"><span class="muted">Culture 01 / demo-ux-v1</span><button data-action="guide">Start guided walkthrough →</button></div></div><div class="work-grid"><aside class="card"><h2 class="rail-label">Forecast setup</h2>${config()}</aside><section class="stack"><div class="card"><div class="row spread"><h2>Experimental timeline</h2><span class="badge">Draft cutoff · day ${state.cutoff}</span></div>${timeline()}</div><div class="card">${observations()}</div><div class="card">${results()}</div></section><aside class="stack" style="align-content:start"><div class="card"><h2 class="section-title">Run history</h2>${runHistory()}</div><div class="card"><h3>Reading this experiment</h3><p class="lead" style="font-size:12px">Lineage describes ancestry. These charts show sampled composition, not cell state or absolute growth.</p><div class="divider"></div><small>Prepared snapshots are imported through the CLI. No browser upload in this release.</small></div></aside></div></main>`;}
function VariantC(){return `<main class="notebook"><aside><div class="eyebrow" style="color:#bfd0c6">C / Run notebook</div><h2 style="margin:16px 0 5px">Research records</h2><small>Fictional recovery study<br>Culture 01 · demo-ux-v1</small><div class="divider"></div><button data-action="new" style="width:100%;margin-bottom:20px">＋ New forecast entry</button>${runHistory()}<p style="margin-top:25px"><small>Entries live only in this tab.<br>Reloading resets the prototype.</small></p></aside><article><div class="eyebrow">Experiment notebook / 001</div><h1 style="margin-top:10px">Following composition<br>through recovery.</h1><p class="lead">Keep the research context, forecast recipe, and evidence in one readable record.</p><section class="entry"><span class="entry-no">01</span><div class="entry-body"><h2>Experimental context</h2>${timeline()}${observations()}</div></section><section class="entry" id="recipe"><span class="entry-no">02</span><div class="entry-body"><h2>Forecast recipe · draft</h2>${config()}</div></section><section class="entry" id="evidence"><span class="entry-no">03</span><div class="entry-body"><h2>Evidence record</h2>${results()}</div></section></article></main>`;}
function PrototypeSwitcher(){return `<div class="switcher" aria-label="Prototype variants"><button data-cycle="-1" aria-label="Previous variant">←</button><small>Compare UX</small>${Object.entries(variantNames).map(([key,name])=>`<button data-variant="${key}" class="${state.variant===key?'active':''}" aria-pressed="${state.variant===key}">${key} · ${name}</button>`).join('')}<button data-cycle="1" aria-label="Next variant">→</button></div><button class="state-toggle" data-action="state">${state.showState?'Close':'Inspect'} prototype state</button>${state.showState?`<section class="state-panel"><b>Full relevant prototype state</b><p>No persistence. All data and worker events are fictional.</p><pre>${JSON.stringify({snapshot:'demo-ux-v1',fixtureCounts:counts,...state},null,2)}</pre><label>Execution scenario <select id="scenario"><option value="success" ${state.scenario==='success'?'selected':''}>Succeed</option><option value="fail" ${state.scenario==='fail'?'selected':''}>Worker interruption</option></select></label><button data-action="reset" style="margin-top:12px">Reset all in-memory runs</button></section>`:''}`;}
function render(){document.getElementById('app').innerHTML=header()+({A:VariantA,B:VariantB,C:VariantC}[state.variant])()+PrototypeSwitcher();console.info('Prototype state',structuredClone(state));}
function changeVariant(v){state.variant=v;const url=new URL(location.href);url.searchParams.set('variant',v);historyAPI.replaceState(null,'',url);render();window.scrollTo(0,0);}
const historyAPI=window.history;
function createRun(source){const r={id:'RUN-'+String(nextRun++).padStart(3,'0'),cutoff:source?.cutoff??state.cutoff,targets:[...(source?.targets??state.targets)],method:source?.method??state.method,scope:'whole',snapshot:'demo-ux-v1',status:'queued',predictions:{},scenario:state.scenario};state.runs.push(r);state.selected=r.id;state.target=r.targets[0];state.step=2;render();if(state.variant==='C')document.getElementById('evidence').scrollIntoView({behavior:'smooth'});setTimeout(()=>{if(r.status!=='queued')return;r.status='running';render()},1600);setTimeout(()=>{if(r.status!=='running')return;r.status=r.scenario==='fail'?'failed':'succeeded';if(r.status==='succeeded')r.targets.forEach(t=>r.predictions[t]=predict(r.cutoff,r.method,t));render()},4500);}
function toast(msg){const div=document.createElement('div');div.className='toast';div.textContent=msg;document.getElementById('overlays').append(div);setTimeout(()=>div.remove(),4000);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.variant)return changeVariant(b.dataset.variant);if(b.dataset.cycle)return changeVariant(['A','B','C'][(['A','B','C'].indexOf(state.variant)+Number(b.dataset.cycle)+3)%3]);if(b.dataset.step){state.step=Number(b.dataset.step);render();return}if(b.dataset.method){state.method=b.dataset.method;render();return}if(b.dataset.run){state.selected=b.dataset.run;state.target=current().targets[0];state.step=2;render();return}if(b.dataset.resultTarget){state.target=Number(b.dataset.resultTarget);render();return}switch(b.dataset.action){case'guide':state.step=0;changeVariant('A');return;case'counts':state.showCounts=!state.showCounts;break;case'state':state.showState=!state.showState;break;case'run':if(eligible())createRun();return;case'cancel':if(current())current().status='cancelled';break;case'retry':createRun(current());return;case'new':state.selected=null;render();document.getElementById('recipe')?.scrollIntoView({behavior:'smooth'});return;case'reset':state.runs.forEach(r=>r.status='cancelled');state.runs=[];state.selected=null;break;case'export':{const r=current();const bundle={warning:'THROWAWAY UX DEMO, not a production evidence bundle',run:r,observed:Object.fromEntries(r.targets.map(t=>[t,counts[t]])),scores:Object.fromEntries(r.targets.map(t=>[t,r.predictions[t].reduce((sum,v,i)=>sum+Math.abs(v-proportions(t)[i]),0)/2])),methodVersion:'ux-fixture-v1',softwareVersion:'throwaway-prototype',seeds:null};const url=URL.createObjectURL(new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=r.id+'-prototype.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Downloaded synthetic prototype evidence.');return;}default:return;}render();});
document.addEventListener('change',e=>{if(e.target.id==='cutoff'){state.cutoff=Number(e.target.value);state.targets=state.targets.filter(t=>t>state.cutoff);if(!state.targets.length)state.targets=[times.find(t=>t>state.cutoff)];}else if(e.target.id==='scope')state.scope=e.target.value;else if(e.target.id==='scenario')state.scenario=e.target.value;else if(e.target.dataset.target){const t=Number(e.target.dataset.target);state.targets=e.target.checked?[...state.targets,t].sort((a,b)=>a-b):state.targets.filter(x=>x!==t);}else return;render();});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]')||!['ArrowLeft','ArrowRight'].includes(e.key)||e.altKey||e.ctrlKey||e.metaKey)return;e.preventDefault();changeVariant(['A','B','C'][(['A','B','C'].indexOf(state.variant)+(e.key==='ArrowRight'?1:2))%3]);});
window.addEventListener('popstate',()=>{const v=new URLSearchParams(location.search).get('variant');state.variant=variantNames[v]?v:'B';render()});render();
</script>
</body>
</html>
